<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selamat Hari Guru 🎓</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="happy-teachers">
    <div class="teachers-day-card">
      <!-- Awan dekoratif di bagian bawah kartu -->
      <div class="clouds"></div>

      <!-- Hati yang mengambang (simbol apresiasi) -->
      <div class="hearts">
        <div class="heartOne">
          <div class="left-side"></div>
          <div class="right-side"></div>
        </div>
        <div class="heartTwo">
          <div class="left-side"></div>
          <div class="right-side"></div>
        </div>
        <div class="heartThree">
          <div class="left-side"></div>
          <div class="right-side"></div>
        </div>
        <div class="heartFour">
          <div class="left-side"></div>
          <div class="right-side"></div>
        </div>
        <div class="heartFive">
          <div class="left-side"></div>
          <div class="right-side"></div>
        </div>
      </div>

      <!-- Teks utama (halaman 1) -->
      <div class="text">
        <span>Selamat<br />Hari Guru!</span>
      </div>
    </div>

    <p class="hover-hint">— arahkan kursor ke kartu untuk melihat pesan —</p>
  </div>
</body>
</html>
